name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*' # Reagiert auf Tags wie v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # WICHTIG: Erlaubt das Anfordern des OIDC-Tokens
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Passe die Version bei Bedarf an

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output artifacts

      - name: NuGet Login (OIDC -> Temporary API Key)
        uses: NuGet/login@v1
        id: login
        with:
          user: 'Stephan Emmermann' # Dein nuget.org-Profilname (KEIN E-Mail, KEINE Organisation)

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json